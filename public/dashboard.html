<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de analítica · FullSport360</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .nav {
      background: #0b1329;
      color: #fff;
      padding: 1rem 3rem;
      font-weight: 700;
      font-size: 1.25rem;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header h1 { font-size: 1.6rem; }
    .header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .estado { font-weight: 600; font-size: 0.85rem; color: var(--red); }
    .estado.online { color: var(--green); }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi, .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .kpi span { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
    .kpi strong { font-size: 1.8rem; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
    .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; }

    .fila { margin-bottom: 0.9rem; }
    .fila-texto { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.3rem; }
    .fondo { height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
    .barra { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
    .barra.azul { background: var(--blue); }
    .barra.verde { background: var(--green); }

    .vacio, #actualizado { color: var(--muted); font-size: 0.9rem; }
    #actualizado { text-align: right; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="nav">FullSport360</div>

  <div class="wrap">
    <div class="header">
      <div>
        <h1>Dashboard de analítica</h1>
        <p>Datos en vivo desde Kafka y DynamoDB</p>
      </div>
      <span id="estado" class="estado">○ Conectando...</span>
    </div>

    <section class="kpis">
      <div class="kpi"><span>Vistas de productos</span><strong id="kpi-vistas">0</strong></div>
      <div class="kpi"><span>Agregados al carrito</span><strong id="kpi-agregados">0</strong></div>
      <div class="kpi"><span>Interacciones totales</span><strong id="kpi-interacciones">0</strong></div>
      <div class="kpi"><span>Productos con actividad</span><strong id="kpi-productos">0</strong></div>
    </section>

    <div class="cols">
      <section class="panel">
        <h2>Productos más vistos</h2>
        <div id="lista-vistos"></div>
      </section>
      <section class="panel">
        <h2>Más agregados al carrito</h2>
        <div id="lista-agregados"></div>
      </section>
    </div>

    <p id="actualizado"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => Number(n || 0).toLocaleString('es-CL');

    let ws = null;
    let cerrado = false;

    function renderLista(contenedor, lista, clase) {
      contenedor.replaceChildren();

      if (!lista || lista.length === 0) {
        const vacio = document.createElement('p');
        vacio.className = 'vacio';
        vacio.textContent = 'Sin datos todavía.';
        contenedor.appendChild(vacio);
        return;
      }

      const maximo = Math.max(...lista.map((p) => p.cantidad), 1);

      for (const p of lista) {
        const fila = document.createElement('div');
        fila.className = 'fila';

        const texto = document.createElement('div');
        texto.className = 'fila-texto';
        const nombre = document.createElement('span');
        nombre.textContent = p.nombre;          // textContent: evita inyectar HTML
        const cantidad = document.createElement('strong');
        cantidad.textContent = p.cantidad;
        texto.append(nombre, cantidad);

        const fondo = document.createElement('div');
        fondo.className = 'fondo';
        const barra = document.createElement('div');
        barra.className = 'barra ' + clase;
        barra.style.width = (p.cantidad / maximo * 100) + '%';
        fondo.appendChild(barra);

        fila.append(texto, fondo);
        contenedor.appendChild(fila);
      }
    }

    function render(m) {
      $('kpi-vistas').textContent = fmt(m.totales.vistas);
      $('kpi-agregados').textContent = fmt(m.totales.agregados);
      $('kpi-interacciones').textContent = fmt(m.totales.interacciones);
      $('kpi-productos').textContent = fmt(m.totales.productosConActividad);
      renderLista($('lista-vistos'), m.masVistos, 'azul');
      renderLista($('lista-agregados'), m.masAgregados, 'verde');
      $('actualizado').textContent =
        'Última actualización: ' + new Date(m.actualizado).toLocaleTimeString('es-CL');
    }

    function setEstado(enVivo) {
      const el = $('estado');
      el.textContent = enVivo ? '● En vivo' : '○ Reconectando...';
      el.classList.toggle('online', enVivo);
    }

    // Mismo host que la pagina: en AWS, nginx reenvia /ws/metricas a ms-analytics
    function urlWebSocket() {
      return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/metricas';
    }

    function conectar() {
      ws = new WebSocket(urlWebSocket());
      ws.onopen = () => setEstado(true);
      ws.onmessage = (evento) => {
        try { render(JSON.parse(evento.data)); } catch (e) { /* mensaje invalido */ }
      };
      ws.onclose = () => {
        setEstado(false);
        if (!cerrado) setTimeout(conectar, 3000);
      };
      ws.onerror = () => ws.close();
    }

    // Carga inicial por HTTP, mientras el WebSocket se conecta
    fetch('/api/analytics/metricas')
      .then((r) => r.json())
      .then(render)
      .catch(() => {});

    conectar();
    window.addEventListener('beforeunload', () => { cerrado = true; if (ws) ws.close(); });
  </script>
</body>
</html>
